name: Release

on:
  push:
    tags: ['v*']
  # Run on main to seed a default-branch cache that future tags can restore.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to build into a draft release; leave empty to warm the cache'
        required: false
        type: string

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    env:
      ODC_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      ODC_UPDATER_PUBLIC_KEY: ${{ vars.ODC_UPDATER_PUBLIC_KEY }}
      ODC_REQUIRE_SIGNING: ${{ vars.ODC_REQUIRE_SIGNING }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          shared-key: release
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Validate requested release tag
        if: github.event_name == 'push' || inputs.release_tag != ''
        run: >-
          node -e "const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8')).version;
          if (process.env.ODC_RELEASE_TAG !== 'v' + version) throw new Error('Release tag must match the checked-out app version.');"
      - name: Prepare signed updater configuration
        id: signing
        if: github.event_name == 'push' || inputs.release_tag != ''
        run: node apps/desktop/scripts/prepare-release.mjs
      - name: Warm release build cache without publishing
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }} --no-bundle -- --locked
      - uses: tauri-apps/tauri-action@v0
        if: github.event_name == 'push' || inputs.release_tag != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.ODC_RELEASE_TAG }}
          releaseName: OpenDroneCinematic ${{ env.ODC_RELEASE_TAG }}
          releaseDraft: true
          prerelease: ${{ contains(env.ODC_RELEASE_TAG, '-') }}
          includeUpdaterJson: ${{ steps.signing.outputs.updater-enabled == 'true' }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json -- --locked
