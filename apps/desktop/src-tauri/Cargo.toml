[package]
name = "opendronecinematic"
version = "0.1.0"
description = "Open-source 3D drone flight planner"
edition = "2021"
license = "MIT"
repository = "https://github.com/opendronecinematic/opendronecinematic"

[workspace]
members = ["localdata"]

[lib]
name = "opendronecinematic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset lets the webview load user-picked local 3D Tiles via convertFileSrc().
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
odc-localdata = { path = "localdata" }
anyhow = "1"
