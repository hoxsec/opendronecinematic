<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" role="img" aria-label="OpenDroneCinematic: plan it, preview it, fly it">
  <defs>
    <linearGradient id="odc-word-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <svg x="20" y="18" width="184" height="184" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="odc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#16314f"/>
    </linearGradient>
    <linearGradient id="odc-path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="odc-lens" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="0.75" stop-color="#0369a1"/>
      <stop offset="1" stop-color="#082f49"/>
    </radialGradient>
    <radialGradient id="odc-rotor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#odc-bg)"/>

  <!-- Orbit flight path around the subject -->
  <ellipse cx="128" cy="132" rx="108" ry="42" transform="rotate(-16 128 132)" fill="none"
           stroke="url(#odc-path)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 11"/>

  <!-- Arms -->
  <g stroke="#e2e8f0" stroke-width="11" stroke-linecap="round">
    <line x1="128" y1="128" x2="74" y2="74"/>
    <line x1="128" y1="128" x2="182" y2="74"/>
    <line x1="128" y1="128" x2="74" y2="182"/>
    <line x1="128" y1="128" x2="182" y2="182"/>
  </g>

  <!-- Rotors (motion-blurred discs) -->
  <g fill="url(#odc-rotor)" stroke="#38bdf8" stroke-width="4">
    <circle cx="74" cy="74" r="30"/>
    <circle cx="182" cy="74" r="30"/>
    <circle cx="74" cy="182" r="30"/>
    <circle cx="182" cy="182" r="30"/>
  </g>
  <g fill="#e2e8f0">
    <circle cx="74" cy="74" r="6"/>
    <circle cx="182" cy="74" r="6"/>
    <circle cx="74" cy="182" r="6"/>
    <circle cx="182" cy="182" r="6"/>
  </g>

  <!-- Body = camera lens with aperture iris -->
  <circle cx="128" cy="128" r="40" fill="#0b1120" stroke="#e2e8f0" stroke-width="7"/>
  <circle cx="128" cy="128" r="28" fill="url(#odc-lens)"/>
  <g fill="#0b1120" fill-opacity="0.82">
    <path d="M128 114 L140.1 121 L140.1 135 L128 142 L115.9 135 L115.9 121 Z"/>
  </g>
  <g stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="1.6" fill="none">
    <path d="M128 100 L140.1 121"/>
    <path d="M152.2 114 L140.1 135"/>
    <path d="M152.2 142 L128 142"/>
    <path d="M128 156 L115.9 135"/>
    <path d="M103.8 142 L115.9 121"/>
    <path d="M103.8 114 L128 114"/>
  </g>
  <circle cx="119" cy="117" r="4.5" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Recording / drone position marker on the path -->
  <circle cx="226" cy="100" r="13" fill="#f472b6" fill-opacity="0.25"/>
  <circle cx="226" cy="100" r="7" fill="#f472b6"/>
</svg>
  <text x="236" y="112" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="#0f172a">OpenDrone<tspan fill="url(#odc-word-light)">Cinematic</tspan></text>
  <text x="240" y="162" font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif" font-size="30" font-weight="500" letter-spacing="0.5" fill="#475569">Plan it. Preview it. Fly it.</text>
</svg>
